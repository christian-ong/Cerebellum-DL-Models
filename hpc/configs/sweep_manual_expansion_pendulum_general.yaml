method: grid

metric:
  name: val_rollout_rmse
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 20
  - --eval_every
  - 1
  - --num_workers
  - 4
  - ${args}

parameters:
  model:
    values:
      - manual_expansion_ml_dmd
      - manual_expansion_eigen_dmd

  data_path:
    - data/trajectories/nonlinear/pendulum_trajectory.npz

  lr:
    values: [1e-4, 5e-4, 1e-3]

  weight_decay:
    values: [0.0, 1e-6]

  batch_size:
    values: [64]

  expansion_degree:
    values: [2, 7]

  expansion_type:
    values: ["general"]

  sine_cosine_expansion:
    values: ["true"]