project: koopman-operator-learning
entity: DeepLearningP4Destruction
method: grid

metric:
  name: val_rollout_rmse_h100
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 100
  - --eval_horizon_divisor
  - 5
  - --eval_every
  - 1
  - --num_workers
  - 4
  - ${args}

parameters:
  model:
    values:
      - mlp_baseline

  data_path:
    values:
      - data/trajectories/linear/inward_spiral/dt_0.05
      - data/trajectories/linear/harmonic_oscillator/dt_0.05
      - data/trajectories/linear/saddle_point/dt_0.05
      - data/trajectories/linear/degenerate_node/dt_0.05
      - data/trajectories/nonlinear/closed_small/dt_0.05
      - data/trajectories/nonlinear/closed_large/dt_0.05
      - data/trajectories/nonlinear/closed_trig_small/dt_0.05
      - data/trajectories/nonlinear/closed_trig_medium/dt_0.05
      - data/trajectories/nonlinear/closed_trig_large/dt_0.05
      - data/trajectories/nonlinear/vanderpol/dt_0.05
      - data/trajectories/nonlinear/duffing/dt_0.05
      - data/trajectories/nonlinear/lotka_volterra/dt_0.05
      - data/trajectories/nonlinear/pendulum/dt_0.05
      - data/trajectories/nonlinear/lorenz/dt_0.05    

  lr:
    values: [1e-3, 1e-4]
  
  rollout_horizon:
    values: [10, 20, 50]

  hidden_dim:
    values: [32, 64, 128]

  num_layers:
    values: [2, 4]

  weight_decay:
    values: [0.0]

  batch_size:
    values: [2048]
