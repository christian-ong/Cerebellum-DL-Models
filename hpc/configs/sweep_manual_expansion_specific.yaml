method: grid

metric:
  name: val_weighted_cumulative_nrmse_h200_g0.99
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 20
  - --eval_every
  - 1
  - --num_workers
  - 4
  - ${args}

parameters:
  model:
    values:
      - ml_dmd
      - ml_linear_dynamics

  data_path:
    values:
      - data/trajectories/nonlinear/vanderpol
      - data/trajectories/nonlinear/lotka_volterra
      - data/trajectories/nonlinear/duffing
      - data/trajectories/nonlinear/lorenz

  lr:
    values: [1e-4, 5e-4, 1e-3]

  weight_decay:
    values: [0.0, 1e-6]

  batch_size:
    values: [512]

  expansion_degree:
    values: [3, 5, 10]

  expansion_type:
    values: ["specific"]

  sine_cosine_expansion:
    values: ["false"]