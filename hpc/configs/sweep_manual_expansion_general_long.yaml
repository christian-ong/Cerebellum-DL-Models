method: grid

metric:
  name: val_discounted_mean_nrmse_h100_g0.99
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 20
  - --eval_every
  - 1
  - --num_workers
  - 0
  - ${args}

parameters:
  model:
    values:
      - ml_dmd
      - ml_linear_dynamics

  data_path:
    values:
      - data/trajectories/nonlinear/vanderpol/long
      - data/trajectories/nonlinear/lotka_volterra/long
      - data/trajectories/nonlinear/duffing/long
      - data/trajectories/nonlinear/lorenz/long

  lr:
    values: [1e-5, 1e-4, 1e-3]

  weight_decay:
    values: [0.0, 1e-6]

  batch_size:
    values: [2048]

  expansion_degree:
    values: [3, 5, 10]

  expansion_type:
    values: ["general"]

  sine_cosine_expansion:
    values: ["false"]

  trajectory_length:
    values: ["long"]