project: koopman-operator-learning
entity: DeepLearningP4Destruction
method: grid

metric:
  name: val_discounted_mean_rmse_h100_g0.99
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 100
  - --rollout_horizon
  - 5
  - --eval_every
  - 1
  - --num_workers
  - 4
  - ${args}

parameters:
  model:
    values:
      - ml_dmd_free
      - ml_linear_dynamics

  data_path:
    values:
      - data/trajectories/nonlinear/vanderpol/short
      - data/trajectories/nonlinear/lotka_volterra/short
      - data/trajectories/nonlinear/duffing/short
      - data/trajectories/nonlinear/lorenz/short

  lr:
    values: [1e-5, 1e-4, 1e-3]

  weight_decay:
    values: [0.0, 1e-6]

  batch_size:
    values: [2048]

  expansion_degree:
    values: [3, 5, 7, 10]

  expansion_type:
    values: ["specific"]

  sine_cosine_expansion:
    values: ["false"]

  trajectory_length:
    values: ["short"]

  bias:
    values: ["true"]