project: koopman-operator-learning
entity: DeepLearningP4Destruction
method: grid

metric:
  name: val_rollout_rmse_h100
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 100
  - --eval_every
  - 1
  - --num_workers
  - 4
  - ${args}

parameters:
  model:
    values:
      - ml_dmd_drop

  data_path:
    values:
      - data/trajectories/nonlinear/closed_trig_large/dt_0.01

  lr:
    values: [1e-3]
  batch_size:
    values: [2048]
  weight_decay:
    values: [0.0]

  # --- FIXED: Shorter horizons ---
  rollout_horizon:
    values: [10, 20]

  # --- NEW: Bi-ortho sweep ---
  biorth_weight:
    values: [0.1, 1.0, 10.0]

  expansion_type:
    values: ["specific"]
  expansion_degree:
    values: [10]
  l1_weight:
    values: [0.0, 1e-4]
  sine_cosine_expansion:
    values: ["false"]
  bias:
    values: ["false"]