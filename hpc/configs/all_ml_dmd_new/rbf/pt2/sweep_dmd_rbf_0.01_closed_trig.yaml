project: koopman-operator-learning
entity: DeepLearningP4Destruction
method: grid

metric:
  name: val_rollout_rmse_h100
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 100
  - --eval_every
  - 1
  - --num_workers
  - 4
  - ${args}

parameters:
  model:
    values:
      - ml_dmd_drop

  data_path:
    values:
      - data/trajectories/nonlinear/closed_trig_small/dt_0.01
      - data/trajectories/nonlinear/closed_trig_medium/dt_0.01
      - data/trajectories/nonlinear/closed_trig_large/dt_0.01

  lr:
    values: [1e-3]
  batch_size:
    values: [2048]
  weight_decay:
    values: [0.0] # Locked to 0.0 based on ml_dmd wins

  # --- FIXED: Shorter horizons for stability ---
  rollout_horizon:
    values: [10, 20, 50] 

  # --- NEW: Test the strictness of the learned inverse ---
  biorth_weight:
    values: [0.1, 1.0, 10.0] 

  # --- RBF ARCHITECTURE ---
  expansion_type:
    values: ["rbf"]
  rbf_n_centers:
    values: [50, 100, 200]
  rbf_center_selection:
    values: ["farthest"]
  rbf_bandwidth_mode:
    values: ["knn"] # Locked to knn based on previous wins
  
  # --- FIXED: Added the winning k=2 configuration ---
  rbf_knn_k:
    values: [2, 5] 

  l1_weight:
    values: [0.0, 1e-4]
  sine_cosine_expansion:
    values: ["false"]
  bias:
    values: ["true"]