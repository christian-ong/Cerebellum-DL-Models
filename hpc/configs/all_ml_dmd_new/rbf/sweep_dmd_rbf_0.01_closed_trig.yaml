project: koopman-operator-learning
entity: DeepLearningP4Destruction
method: grid

metric:
  name: val_rollout_rmse_h100
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 100
  - --eval_every
  - 1
  - --num_workers
  - 4
  - ${args}

parameters:
  model:
    values:
      - ml_dmd_drop

  data_path:
    values:
      - data/trajectories/nonlinear/closed_trig_small/dt_0.01
      - data/trajectories/nonlinear/closed_trig_medium/dt_0.01
      - data/trajectories/nonlinear/closed_trig_large/dt_0.01

  lr:
    values: [1e-3]

  # ---------------- RBF SPECIFIC PARAMETERS ----------------
  expansion_type:
    values: ["rbf"]

  rbf_n_centers:
    values: [50, 100, 200]

  rbf_center_selection:
    values: ["farthest"]

  rbf_bandwidth_mode:
    values: ["knn", "global"]

  rbf_knn_k:
    values: [5]
  # ---------------------------------------------------------

  rollout_horizon:
    values: [20, 50]

  l1_weight:
    values: [0.0, 1e-4]

  weight_decay:
    values: [0.0, 1e-5]

  batch_size:
    values: [2048]

  sine_cosine_expansion:
    values: ["false"]

  bias:
    values: ["true"]