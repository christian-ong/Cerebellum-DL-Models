project: koopman-operator-learning
entity: DeepLearningP4Destruction
method: grid

metric:
  name: val_rollout_rmse_h100
  goal: minimize

command:
  - ${env}
  - python
  - -m
  - scripts.train_sweep
  - --epochs
  - 100
  - --eval_every
  - 1
  - --eval_horizon_divisor
  - 5
  - --num_workers
  - 4
  - ${args}

parameters:
  model:
    values:
      - ml_linear_dynamics

  data_path:
    values:
      - data/trajectories/nonlinear/vanderpol/dt_0.05
      - data/trajectories/nonlinear/lotka_volterra/dt_0.05
      - data/trajectories/nonlinear/duffing/dt_0.05
      - data/trajectories/nonlinear/pendulum/dt_0.05
      - data/trajectories/nonlinear/lorenz/dt_0.05

  lr:
    values: [1e-3]
  
  rollout_horizon:
    values: [4, 10]
  
  expansion_type:
    values: ["hankel_svd"]

  delay_depth:
    values: [10, 30, 50]

  hankel_rank:
    values: [5, 10, 20]

  weight_decay:
    values: [0.0, 1e-5]

  batch_size:
    values: [2048]

  sine_cosine_expansion:
    values: ["false"]

  bias:
    values: ["true"]